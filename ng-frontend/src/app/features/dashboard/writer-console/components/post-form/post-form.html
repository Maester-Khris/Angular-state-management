<div class="p-3">
  <div class="field-section">
    <label class="field-label">Title</label>
    <input type="text" class="form-control form-control-sm border-0 bg-light py-2"
      placeholder="e.g. Mastering Angular Signals" [(ngModel)]="title" />
  </div>

  <div class="field-section">
    <label class="field-label">Description</label>
    <textarea class="form-control border-0 bg-light smallest" rows="6" placeholder="What's the story about?"
      [(ngModel)]="description"></textarea>
  </div>

  <div class="field-section">
    <label class="field-label">Cover Image</label>
    <div class="upload-zone rounded-3" [class.uploading]="isUploading">
      <input type="file" class="file-input" (change)="onFileSelected($event)" accept="image/*"
        [disabled]="isUploading" />
      <div class="upload-placeholder d-flex align-items-center gap-2">
        <i class="bi" [class]="isUploading ? 'bi-hourglass-split spin' : 'bi-image text-primary'"></i>
        <span class="smallest">{{ isUploading ? 'Uploading to vault...' : 'Click to upload image' }}</span>
      </div>
    </div>

    <div class="image-preview-box mt-3 position-relative" *ngIf="imagePreview">
      <img [src]="imagePreview" class="rounded-2 shadow-sm w-100" [style.opacity]="isUploading ? '0.5' : '1'"
        alt="Preview" />
      @if (isUploading) {
      <div class="upload-overlay">
        <div class="spinner-border spinner-border-sm text-white" role="status"></div>
      </div>
      }
      <button type="button" class="btn-remove-img" (click)="removeImage()" *ngIf="!isUploading">&times;</button>
    </div>
  </div>

  <div class="field-section">
    <label class="field-label">Hashtags</label>
    <div class="d-flex gap-2 flex-wrap mb-2">
      @for (tag of hashtags; track tag) {
      <span class="badge bg-light text-dark border">#{{ tag }}
        <button type="button" class="btn-close btn-close-sm ms-1" (click)="removeHashtag(tag)"></button>
      </span>
      }
    </div>

    <div class="input-group input-group-sm">
      <input type="text" class="form-control border-0 bg-light" placeholder="Add tag..." [(ngModel)]="hashtag"
        (keydown.enter)="$event.preventDefault(); addHashtag()" />
      <button class="btn btn-light border" type="button" (click)="addHashtag()">
        <i class="bi bi-plus"></i>
      </button>
    </div>
  </div>

  <div class="action-row">
    <button class="action-btn draft" (click)="onSaveDraft()" [disabled]="!title">
      <i class="bi bi-archive btn-icon"></i> Save Draft
    </button>
    <button class="action-btn publish" (click)="onPublish()" [disabled]="!title || !description">
      <i class="bi bi-send btn-icon"></i> Publish
    </button>
  </div>

</div>
