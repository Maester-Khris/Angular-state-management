<div class="d-flex flex-column h-100 p-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <span class="badge bg-light text-muted border smallest fw-bold">
      <i class="bi bi-eye me-1"></i> Feed card preview
    </span>
    <button type="button" class="btn-close" (click)="closed.emit()"></button>
  </div>

  <!-- Simulated feed card -->
  <div class="card border-0 shadow-sm overflow-hidden">
    @if (post.images.length > 0) {
      <img [src]="post.images[0]" class="card-img-top" style="height:160px;object-fit:cover" alt="" />
    }
    <div class="card-body p-3">
      <!-- Hashtag pill -->
      @if (post.hashtags.length > 0) {
        <span class="badge rounded-pill bg-primary-subtle text-primary mb-2 smallest">
          #{{ post.hashtags[0] }}
        </span>
      }

      <!-- Title -->
      <h6 class="fw-bold mb-1 lh-sm">{{ post.title }}</h6>

      <!-- Description — 3 line clamp -->
      <p class="smallest text-muted mb-3" style="display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">
        {{ post.description }}
      </p>

      <!-- Author row -->
      <div class="d-flex align-items-center gap-2">
        @if (post.authorAvatar) {
          <img [src]="post.authorAvatar" class="rounded-circle border" width="24" height="24" alt="" />
        } @else {
          <div class="rounded-circle bg-light border d-flex align-items-center justify-content-center"
            style="width:24px;height:24px">
            <i class="bi bi-person-fill smallest text-muted"></i>
          </div>
        }
        <span class="smallest fw-medium">{{ post.authorName }}</span>
        @if (post.readTime) {
          <span class="smallest text-muted ms-auto">{{ post.readTime }} min read</span>
        }
      </div>
    </div>
  </div>
</div>
