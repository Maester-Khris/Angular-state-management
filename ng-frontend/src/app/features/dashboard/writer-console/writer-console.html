<div class="writer-layout">

  <!-- Left column: New post + My posts panels -->
  <div class="writer-left-col d-flex flex-column gap-3">

    <!-- New post panel -->
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white border-0 d-flex justify-content-between align-items-center py-2 px-3">
        <span class="small fw-semibold">New post</span>
        <button class="panel-ctrl" (click)="toggleNewForm()" [title]="showNewForm() ? 'Collapse' : 'Expand'">
          <i class="bi" [class]="showNewForm() ? 'bi-dash' : 'bi-plus'"></i>
        </button>
      </div>
      @if (showNewForm()) {
      <div class="card-body p-0">
        <app-post-form></app-post-form>
      </div>
      }
    </div>

    <!-- My posts panel -->
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white border-0 d-flex justify-content-between align-items-center py-2 px-3">
        <span class="small fw-semibold">
          My posts
          <span class="badge bg-light text-muted border ms-1">{{ posts().length }}</span>
        </span>
        <button class="panel-ctrl" (click)="toggleList()" [title]="showList() ? 'Collapse' : 'Expand'">
          <i class="bi" [class]="showList() ? 'bi-dash' : 'bi-plus'"></i>
        </button>
      </div>
      @if (showList()) {
      <div class="card-body p-0">
        <app-post-list [posts]="posts()" (editPost)="onEditPost($event)" (previewPost)="onPreviewPost($event)">
        </app-post-list>
      </div>
      }
    </div>

  </div>

  <!-- Right area: Edit + Preview panels -->
  <div class="writer-right-area">

    @if (showEdit() && activePost()) {
    <div class="card border-0 shadow-sm edit-panel">
      <div class="card-body p-0">
        <app-post-edit [post]="activePost()!" (closed)="onCloseEdit()" (saved)="onCloseEdit()"
          (published)="onCloseEdit()" (deleted)="onCloseEdit()">
        </app-post-edit>
      </div>
    </div>
    }

    @if (showPreview() && activePost()) {
    <div class="card border-0 shadow-sm preview-panel">
      <app-post-preview [post]="activePost()!" (closed)="onClosePreview()">
      </app-post-preview>
    </div>
    }

    @if (!showEdit() && !showPreview()) {
    <div class="d-flex align-items-center justify-content-center w-100 text-muted" style="min-height:200px">
      <div class="text-center">
        <i class="bi bi-layout-text-sidebar-reverse fs-2 d-block mb-2 opacity-25"></i>
        <span class="small">Click + to expand a panel or select a post to edit</span>
      </div>
    </div>
    }

  </div>

</div>
