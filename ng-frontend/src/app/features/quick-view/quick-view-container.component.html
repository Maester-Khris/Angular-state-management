@if (showEmptyFallback()) {
<div class="empty-fallback">
  <p>No reading session active.</p>
  <a routerLink="/home">Back to feed</a>
</div>
} @else {
<div class="quick-view-overlay" style="">
  <button class="btn-close-overlay" (click)="onClose()" title="Close">
    <i class="bi bi-x-lg"></i>
  </button>

  <app-quick-view-rail [queue]="posts()" [activeIndex]="activeIndex()" (navigate)="onNavigate($event)">
  </app-quick-view-rail>

  @if (currentPost()) {
  <app-quick-view-content [post]="currentPost()!" [slideDir]="slideDir()" [queue]="posts()"
    [activeIndex]="activeIndex()" (readFull)="onReadFull($event)" (next)="navigateNext()" (prev)="navigatePrev()"
    (navigateTo)="onNavigate($event)">
  </app-quick-view-content>
  }
</div>
}
