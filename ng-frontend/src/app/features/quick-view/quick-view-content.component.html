@if (post) {
<div class="quick-view-content" [ngClass]="'slide-' + slideDir">
  <div class="content-header">
    <span class="category-tag">#Engineering</span>
  </div>

  <h2 class="content-title">{{ post.title }}</h2>

  <div class="author-row">
    <div class="author-initials">{{ post.createdBy.charAt(0).toUpperCase() }}</div>
    <span class="author-name">{{ post.createdBy }}</span>
    <span class="date">{{ post.createdAt | date:'mediumDate' }}</span>
  </div>

  @if (post.imageUrl) {
    <img [src]="post.imageUrl" [alt]="post.title" class="cover-image">
  }

  <p class="description">{{ post.description }}</p>

  <button class="btn-read-full" (click)="onReadFull()">
    Read full post →
  </button>
</div>
}
